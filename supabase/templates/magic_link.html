<!-- Sent when an existing user asks for a sign-in link. The button goes to our /auth/confirm route with a one-time token. -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #111827;">
  <h2 style="margin: 0 0 12px;">Sign in to Shipwright</h2>
  <p style="margin: 0 0 20px; line-height: 1.5;">Click the button to sign in. The link works once and expires soon.</p>
  <p style="margin: 0 0 20px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="display: inline-block; padding: 12px 20px; background: #3b4fd8; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 600;">Sign in</a>
  </p>
  <p style="margin: 0 0 8px; font-size: 14px; color: #4b5563;">Button not working? Copy this link into your browser:</p>
  <p style="margin: 0 0 20px; font-size: 13px; word-break: break-all; color: #4b5563;">{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email</p>
  <p style="margin: 0; font-size: 13px; color: #6b7280;">If you didn't ask for this, you can ignore this email.</p>
</div>

packages:
  - apps/*
  - packages/*
  - playground

allowBuilds:
  # esbuild only comes in through tsx (playground). Its install script is an optional speed-up, so skip it.
  esbuild: false

catalog:
  next: 16.4.2
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/node": ^26.6.5
  typescript: ^7.0.2
  zod: ^4.6.7
  "@anthropic-ai/sdk": ^0.134.0
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  radix-ui: ^1.8.1
  lucide-react: ^1.60.0
  next-themes: ^0.4.6
  motion: 14.6.0
  # AI SDK 7 ships patches almost daily: pin exact versions, upgrade on purpose.
  ai: 7.0.150
  "@ai-sdk/react": 4.0.154
  "@ai-sdk/anthropic": 4.0.87
  "@ai-sdk/provider": 4.0.33
  streamdown: 2.7.1
